name: sync-license-docs
on:
  push:
    branches: [chore/license-agpl-3-or-later]
    paths:
      - '.github/workflows/_sync-license-docs.yml'
permissions:
  contents: write
jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: chore/license-agpl-3-or-later
      - name: Update release-readiness license status
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def rep(path, old, new):
              p = Path(path)
              s = p.read_text()
              if old not in s:
                  raise SystemExit(f'missing expected text in {path}: {old!r}')
              p.write_text(s.replace(old, new))

          rep('docs/READINESS_AUDIT.md',
              '1. **real hardware acceptance** — issue #10: amd64 + real supported UPS, arm64 + real supported UPS, and real Synology DSM NUT-secondary acceptance with retained evidence;\n2. **project license selection** — issue #12: project-owner/legal decision, root `LICENSE`, README/license compatibility review and third-party notice reconciliation;\n3. **main-branch protection** — issue #39: repository-admin configuration requiring PRs and green CI for `main`. The connected automation can create and merge PRs but cannot administer branch-protection settings.',
              '1. **real hardware acceptance** — issue #10: amd64 + real supported UPS, arm64 + real supported UPS, and real Synology DSM NUT-secondary acceptance with retained evidence;\n2. **main-branch protection** — issue #39: repository-admin configuration requiring PRs and green CI for `main`. The connected automation can create and merge PRs but cannot administer branch-protection settings.')
          rep('docs/READINESS_AUDIT.md',
              '| Project license | BLOCKED | human project decision required |',
              '| Project license | READY | GNU AGPL-3.0-or-later; canonical root `LICENSE` present |')
          rep('docs/READINESS_AUDIT.md',
              '[ ] root LICENSE selected and added',
              '[x] root LICENSE selected and added (`AGPL-3.0-or-later`)')

          rep('ROADMAP.md',
              '- Select and add the root project **LICENSE** before tagged public release/source reuse.\n',
              '')

          rep('CHANGELOG.md',
              '- Hardware acceptance protocol and non-destructive hardware preflight helper.\n',
              '- Hardware acceptance protocol and non-destructive hardware preflight helper.\n- Project licensing under GNU AGPL-3.0-or-later with canonical root `LICENSE`.\n')
          rep('CHANGELOG.md',
              '- Project license must be selected before tagged public release or copying/adapting upstream source.\n',
              '')

          rep('docs/IMPLEMENTATION_DECISIONS.md',
              '**Release state:** software acceptance green; physical UPS/DSM acceptance and root license remain open',
              '**Release state:** software acceptance green; project licensed AGPL-3.0-or-later; physical UPS/DSM acceptance remains open')

          rep('docs/IMPROVEMENT_PLAN.md',
              '1. issue #10 has retained physical evidence for the required platforms and DSM;\n2. issue #12 has a selected root `LICENSE` and reuse/distribution review;\n3. the final release CI/package pipeline remains green on the release commit.',
              '1. issue #10 has retained physical evidence for the required platforms and DSM;\n2. the final release CI/package pipeline remains green on the release commit.\n\nThe project license is selected as `AGPL-3.0-or-later`. Any future copied/adapted upstream source still requires per-component license compatibility and attribution review before inclusion.')
          PY
      - name: Commit documentation sync
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/READINESS_AUDIT.md ROADMAP.md CHANGELOG.md docs/IMPLEMENTATION_DECISIONS.md docs/IMPROVEMENT_PLAN.md
          git commit -m 'docs: record AGPL-3.0-or-later license decision'
          git push origin HEAD:chore/license-agpl-3-or-later
