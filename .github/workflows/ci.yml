name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  agent:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: agent
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'
          cache-dependency-path: agent/go.sum
      - name: Download dependencies
        run: go mod download
      - name: Unit tests
        run: go test ./...
      - name: Canonical YAML integration test
        run: go test -tags integrationyaml ./internal/config
      - name: Vet
        run: go vet ./...
      - name: Build amd64
        env: {GOOS: linux, GOARCH: amd64}
        run: go build ./cmd/...
      - name: Build arm64
        env: {GOOS: linux, GOARCH: arm64}
        run: go build ./cmd/...
      - name: Build riscv64
        env: {GOOS: linux, GOARCH: riscv64}
        run: go build ./cmd/...

  installer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Bash syntax
        run: bash -n install.sh scripts/install/common.sh scripts/install/nut.sh scripts/install/validate.sh scripts/install/transaction.sh scripts/install/distros/*.sh scripts/test/install-e2e.sh
      - name: Installer self-check
        run: |
          ./install.sh --check --profile local-server
          ./install.sh --check --profile remote-client
          ./install.sh --check --profile existing-nut

  installer-e2e:
    needs: [agent, installer]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'
          cache-dependency-path: agent/go.sum
      - name: Real NUT dummy-ups + systemd install/rollback acceptance
        run: ./scripts/test/install-e2e.sh
