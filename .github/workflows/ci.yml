name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  agent:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: agent
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'
          cache-dependency-path: agent/go.sum
      - name: Download dependencies
        run: go mod download
      - name: Unit tests
        run: go test ./...
      - name: Canonical YAML integration test
        run: go test -tags integrationyaml ./internal/config
      - name: Vet
        run: go vet ./...
      - name: Build amd64
        env: {GOOS: linux, GOARCH: amd64}
        run: go build ./cmd/...
      - name: Build arm64
        env: {GOOS: linux, GOARCH: arm64}
        run: go build ./cmd/...
      - name: Build riscv64
        env: {GOOS: linux, GOARCH: riscv64}
        run: go build ./cmd/...
