name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  agent:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: agent
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26.x'
          cache-dependency-path: agent/go.sum
      - name: Download dependencies
        run: go mod download
      - name: Format check
        run: |
          unformatted="$(gofmt -l .)"
          if [[ -n "$unformatted" ]]; then
            echo '::error::gofmt required for:'
            printf '%s\n' "$unformatted"
            gofmt -d .
            exit 1
          fi
      - name: Unit tests and coverage floor
        run: |
          go test -coverprofile=coverage.out ./...
          total="$(go tool cover -func=coverage.out | awk '/^total:/ {gsub(/%/,"",$3); print $3}')"
          echo "total coverage: $total% (required: >= 56%)"
          awk -v total="$total" 'BEGIN { if ((total + 0) < 56) exit 1 }'
      - name: Safety package coverage floors
        run: |
          check_package() {
            pkg="$1"
            floor="$2"
            output="$(go test -cover "./internal/$pkg")"
            printf '%s\n' "$output"
            coverage="$(sed -nE 's/.*coverage: ([0-9]+([.][0-9]+)?)% of statements.*/\1/p' <<<"$output" | tail -n1)"
            [[ -n "$coverage" ]] || { echo "unable to parse coverage for $pkg" >&2; exit 1; }
            awk -v got="$coverage" -v want="$floor" 'BEGIN { if ((got + 0) < (want + 0)) exit 1 }' || {
              echo "coverage for internal/$pkg is $coverage%, required >= $floor%" >&2
              exit 1
            }
          }
          check_package policy 58
          check_package orchestrator 68
          check_package host 70
          check_package state 73
      - name: Schema contract
        working-directory: .
        run: |
          python3 -m pip install --disable-pip-version-check 'check-jsonschema==0.35.0'
          cp config/config.yaml.example /tmp/cockpit-ups-wol-config.yaml
          check-jsonschema --schemafile schemas/config.schema.json /tmp/cockpit-ups-wol-config.yaml
          (cd agent && go run ./internal/state/cmd/schema-fixture) > /tmp/cockpit-ups-wol-state.json
          check-jsonschema --schemafile schemas/state.schema.json /tmp/cockpit-ups-wol-state.json
      - name: Race detector
        run: go test -race ./...
      - name: Canonical YAML integration test
        run: go test -tags integrationyaml ./internal/config
      - name: Generated NUT FSD/Synology integration test
        run: go test -tags integrationnut ./internal/nut
      - name: Vet
        run: go vet ./...
      - name: Staticcheck
        run: |
          go install honnef.co/go/tools/cmd/staticcheck@v0.7.0
          staticcheck ./...
      - name: Build amd64
        env: {GOOS: linux, GOARCH: amd64}
        run: go build ./cmd/...
      - name: Build arm64
        env: {GOOS: linux, GOARCH: arm64}
        run: go build ./cmd/...
      - name: Build riscv64
        env: {GOOS: linux, GOARCH: riscv64}
        run: go build ./cmd/...

  security:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26.x'
          cache-dependency-path: agent/go.sum
      - name: Govulncheck
        working-directory: agent
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.8.0
          govulncheck ./...

  architecture-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26.x'
          cache-dependency-path: agent/go.sum
      - name: Install user-mode emulators
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends qemu-user-static
      - name: Build static smoke binaries
        working-directory: agent
        run: |
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -trimpath -o /tmp/cockpit-ups-wol-agent-amd64 ./cmd/cockpit-ups-wol-agent
          CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build -trimpath -o /tmp/cockpit-ups-wol-agent-arm64 ./cmd/cockpit-ups-wol-agent
          CGO_ENABLED=0 GOOS=linux GOARCH=riscv64 go build -trimpath -o /tmp/cockpit-ups-wol-agent-riscv64 ./cmd/cockpit-ups-wol-agent
      - name: amd64 runtime smoke
        run: /tmp/cockpit-ups-wol-agent-amd64 --version | grep -q '"version"'
      - name: arm64 runtime smoke under QEMU
        run: qemu-aarch64-static /tmp/cockpit-ups-wol-agent-arm64 --version | grep -q '"version"'
      - name: riscv64 runtime smoke under QEMU
        run: qemu-riscv64-static /tmp/cockpit-ups-wol-agent-riscv64 --version | grep -q '"version"'

  installer:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Bash syntax
        run: find . -type f -name '*.sh' -not -path './.git/*' -print0 | xargs -0 -n1 bash -n
      - name: ShellCheck
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends shellcheck
          # Warning- and error-level findings are merge-blocking; info/style
          # remain advisory so the gate matches the review's requested floor.
          find . -type f -name '*.sh' -not -path './.git/*' -print0 | xargs -0 shellcheck -x -S warning
      - name: Installer backend unit tests
        run: ./scripts/test/installer-unit.sh
      - name: Installer self-check
        run: |
          ./install.sh --check --profile local-server
          ./install.sh --check --profile remote-client
          ./install.sh --check --profile existing
          ./install.sh --check --profile local-server --network-mode restricted --allow-client 192.168.10.0/24
          ./install.sh --check --tui --profile local-server
      - name: Reject incompatible silent TUI modes
        run: |
          if ./install.sh --check --silent --tui; then
            echo 'silent+tui unexpectedly succeeded' >&2
            exit 1
          fi

  installer-e2e:
    needs: [agent, installer, security]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26.x'
          cache-dependency-path: agent/go.sum
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24.x'
      - name: Build production Cockpit bundle
        working-directory: cockpit
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npm run typecheck
          npm run build
      - name: Real NUT + Cockpit + systemd install/rollback acceptance
        run: ./scripts/test/install-e2e.sh
