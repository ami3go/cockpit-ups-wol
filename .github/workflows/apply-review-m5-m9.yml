          if old not in text:
              raise SystemExit('readManifest block not found')
          text = text.replace(old, new, 1)

          old = '''func (m *Manager) writePointer(name, value string) error {
          \treturn writeAtomic(m.pointerPath(name), []byte(value+"\\n"), 0o600)
          }'''
          new = '''func (m *Manager) writePointer(name, value string) error {
          \tif err := ValidateRevisionID(value); err != nil {
          \t\treturn fmt.Errorf("write %s pointer: %w", name, err)
          \t}
          \treturn writeAtomic(m.pointerPath(name), []byte(value+"\\n"), 0o600)
          }'''
          if old not in text:
              raise SystemExit('writePointer block not found')
          text = text.replace(old, new, 1)

          old = '''\treturn strings.TrimSpace(string(b)), nil
          }'''
          new = '''\tvalue := strings.TrimSpace(string(b))
          \tif value == "" {
          \t\treturn "", nil
          \t}
          \tif err := ValidateRevisionID(value); err != nil {
