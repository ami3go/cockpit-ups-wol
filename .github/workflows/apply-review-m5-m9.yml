name: apply-review-m5-m9

on:
  push:
    branches:
      - fix/review-m5-m9-config-history

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: fix/review-m5-m9-config-history
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version-file: agent/go.mod
          cache-dependency-path: agent/go.sum
      - name: Apply and verify review hardening
        run: |
          python3 scripts/dev/apply-review-m5-m9.py
          gofmt -w agent/internal/config/revision.go agent/internal/config/revision_maintenance.go agent/internal/config/revision_hardening_test.go agent/cmd/cockpit-ups-wolctl/main.go
          (cd agent && go test ./internal/config ./cmd/cockpit-ups-wolctl)
          rm -f .github/workflows/apply-review-m5-m9.yml scripts/dev/apply-review-m5-m9.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix(config): validate and prune revision history'
          git push origin HEAD:fix/review-m5-m9-config-history
