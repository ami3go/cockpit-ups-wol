name: apply-review-final-hardening-v2

on:
  push:
    branches:
      - fix/review-systemd-ipc-cleanups

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: fix/review-systemd-ipc-cleanups
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version: '1.23.x'
          cache-dependency-path: agent/go.sum
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24.x'
      - name: Apply and verify final hardening
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          from pathlib import Path

          def replace(path, old, new):
              p=Path(path); s=p.read_text()
              if old not in s: raise SystemExit(f'insertion point not found: {path}')
              p.write_text(s.replace(old,new,1))

          Path('packaging/systemd/cockpit-ups-wol-agent.service').write_text('''[Unit]
          Description=cockpit-ups-wol power management agent
          After=network-online.target
          Wants=network-online.target
          StartLimitIntervalSec=0

          [Service]
          Type=notify
          ExecStart=/usr/libexec/cockpit-ups-wol/cockpit-ups-wol-agent --foreground
          Restart=always
          RestartSec=10s
          WatchdogSec=30s
          NotifyAccess=main
          RuntimeDirectory=cockpit-ups-wol
          StateDirectory=cockpit-ups-wol
          ConfigurationDirectory=cockpit-ups-wol
          NoNewPrivileges=yes
          PrivateTmp=yes
          ProtectHome=yes
          ProtectSystem=strict
          ProtectKernelTunables=yes
          ProtectKernelModules=yes
          ProtectControlGroups=yes
          RestrictAddressFamilies=AF_UNIX AF_INET AF_INET6 AF_NETLINK
          RestrictSUIDSGID=yes
          RestrictNamespaces=yes
          LockPersonality=yes
          MemoryDenyWriteExecute=yes
          SystemCallFilter=@system-service
          SystemCallErrorNumber=EPERM
          CapabilityBoundingSet=CAP_NET_RAW CAP_NET_BROADCAST CAP_NET_ADMIN CAP_KILL CAP_SYS_BOOT
          ReadWritePaths=/var/lib/cockpit-ups-wol /run/cockpit-ups-wol /etc/cockpit-ups-wol

          [Install]
          WantedBy=multi-user.target
          ''')

          for path in ('agent/internal/ipc/server.go','agent/internal/app/runtime.go','agent/internal/app/armed.go'):
              p=Path(path); s=p.read_text()
              if '0o660' not in s: raise SystemExit(f'0660 socket mode not found: {path}')
              p.write_text(s.replace('0o660','0o600',1))

          p=Path('agent/internal/ipc/server_test.go'); s=p.read_text()
          s=s.replace('"path/filepath"\n','"os"\n\t"path/filepath"\n',1)
          replace_text='''\t\t\tcancel()
          \t\t\t<-done
          '''
          replacement='''\t\t\tinfo, statErr := os.Stat(path)
          \t\t\tif statErr != nil { t.Fatalf("stat socket: %v", statErr) }
          \t\t\tif got := info.Mode().Perm(); got != 0o600 { t.Fatalf("socket mode=%#o want 0600", got) }
          \t\t\tcancel()
          \t\t\t<-done
          '''
          if replace_text not in s: raise SystemExit('socket-test insertion point missing')
          p.write_text(s.replace(replace_text,replacement,1))

          p=Path('scripts/install/common.sh'); s=p.read_text()
          old='''platform_detect(){ [[ -r /etc/os-release ]]||die "/etc/os-release not found"; source /etc/os-release; local id="${ID:-}" like="${ID_LIKE:-}"; case " $id $like " in *" debian "*|*" ubuntu "*) DISTRO_FAMILY=debian;; *" arch "*) DISTRO_FAMILY=arch;; *" fedora "*|*" rhel "*|*" centos "*) DISTRO_FAMILY=fedora;; *) die "unsupported distribution: ${ID:-unknown}";; esac; case "$(uname -m)" in x86_64|amd64) TARGET_ARCH=amd64;; aarch64|arm64) TARGET_ARCH=arm64;; riscv64) TARGET_ARCH=riscv64;; *) die "unsupported architecture: $(uname -m)";; esac; }
          '''
          new='''platform_detect(){
            [[ -r /etc/os-release ]]||die "/etc/os-release not found"
            local detected id like
            detected="$( ( # shellcheck disable=SC1091
              source /etc/os-release
              printf '%s\\n%s\\n' "${ID:-}" "${ID_LIKE:-}"
            ) )"
            id="${detected%%$'\\n'*}"; like="${detected#*$'\\n'}"
            case " $id $like " in
              *" debian "*|*" ubuntu "*) DISTRO_FAMILY=debian;;
              *" arch "*) DISTRO_FAMILY=arch;;
              *" fedora "*|*" rhel "*|*" centos "*) DISTRO_FAMILY=fedora;;
              *) die "unsupported distribution: ${id:-unknown}";;
            esac
            case "$(uname -m)" in
              x86_64|amd64) TARGET_ARCH=amd64;; aarch64|arm64) TARGET_ARCH=arm64;; riscv64) TARGET_ARCH=riscv64;;
              *) die "unsupported architecture: $(uname -m)";;
            esac
          }
          '''
          if old not in s: raise SystemExit('platform_detect insertion point missing')
          p.write_text(s.replace(old,new,1))

          replace('cockpit/build.mjs','  sourcemap: true,','  sourcemap: false,')

          fixture=Path('config/config.yaml.example').read_text()
          td=Path('agent/internal/config/testdata'); td.mkdir(parents=True,exist_ok=True)
          (td/'config.yaml.example').write_text(fixture)
          for path,old,new in (
              ('agent/internal/config/bootstrap_test.go','../../../config/config.yaml.example','testdata/config.yaml.example'),
              ('agent/internal/config/yaml_integration_test.go','../../../config/config.yaml.example','testdata/config.yaml.example'),
              ('agent/internal/report/report_test.go','../../../config/config.yaml.example','../config/testdata/config.yaml.example')):
              p=Path(path); s=p.read_text()
              if old not in s: raise SystemExit(f'fixture path missing: {path}')
              p.write_text(s.replace(old,new))

          p=Path('agent/internal/config/config.go'); s=p.read_text()
          start=s.index('\tvar visit func(string) bool', s.index('func validateHostDependencyCycles'))
          end=s.index('\n}\n\nfunc validateUniquePriority', start)
          block='''\tvar visit func(string)
          \tvisit = func(id string) {
          \t\tswitch marks[id] {
          \t\tcase visiting:
          \t\t\tstart := 0
          \t\t\tfor i, v := range stack { if v == id { start = i; break } }
          \t\t\tcycle := append(append([]string(nil), stack[start:]...), id)
          \t\t\t*problems = append(*problems, "recovery dependency cycle detected: "+strings.Join(cycle, " -> "))
          \t\t\treturn
          \t\tcase visited:
          \t\t\treturn
          \t\t}
          \t\tmarks[id] = visiting
          \t\tstack = append(stack, id)
          \t\tfor _, dep := range graph[id] { if _, ok := graph[dep]; ok { visit(dep) } }
          \t\tstack = stack[:len(stack)-1]
          \t\tmarks[id] = visited
          \t}
          \tfor id := range graph { if marks[id] == unvisited { visit(id) } }
          '''
          p.write_text(s[:start]+block+s[end:])

          p=Path('agent/internal/config/revision.go'); s=p.read_text()
          old='''\tid := m.uniqueRevisionID(hexsum)
          \tparent, _ := m.readPointer("active")'''
          new='''\tid, err := m.uniqueRevisionID(hexsum)
          \tif err != nil { return Manifest{}, err }
          \tparent, _ := m.readPointer("active")'''
          if old not in s: raise SystemExit('uniqueRevisionID caller missing')
          s=s.replace(old,new,1)
          start=s.index('func (m *Manager) uniqueRevisionID(')
          end=s.index('\nfunc manifestHash',start)
          func='''const maxRevisionIDAttempts = 100

          func (m *Manager) uniqueRevisionID(contentHash string) (string, error) {
          \tif len(contentHash) < 8 { return "", errors.New("content hash is too short to allocate revision id") }
          \tbase := fmt.Sprintf("cfg-%s-%s", m.Now().UTC().Format("20060102T150405Z"), contentHash[:8])
          \tfor n := 0; n < maxRevisionIDAttempts; n++ {
          \t\tid := base
          \t\tif n > 0 { id = fmt.Sprintf("%s-%d", base, n) }
          \t\t_, err := os.Stat(m.revisionDir(id))
          \t\tif errors.Is(err, os.ErrNotExist) { return id, nil }
          \t\tif err != nil { return "", fmt.Errorf("check revision id %q: %w", id, err) }
          \t}
          \treturn "", fmt.Errorf("unable to allocate unique revision id after %d attempts", maxRevisionIDAttempts)
          }
          '''
          p.write_text(s[:start]+func+s[end:])

          Path('agent/internal/config/review_cleanup_test.go').write_text('''package config

          import (
          \t"fmt"
          \t"os"
          \t"path/filepath"
          \t"strings"
          \t"testing"
          \t"time"
          )

          func TestDependencyValidationReportsIndependentCycles(t *testing.T) {
          \thosts := []HostConfig{{ID:"a",DependsOn:[]string{"b"}},{ID:"b",DependsOn:[]string{"a"}},{ID:"c",DependsOn:[]string{"d"}},{ID:"d",DependsOn:[]string{"c"}}}
          \tvar problems []string
          \tvalidateHostDependencyCycles(&problems,hosts)
          \tcount:=0; for _,p:=range problems { if strings.Contains(p,"recovery dependency cycle detected") { count++ } }
          \tif count != 2 { t.Fatalf("problems=%v want 2 cycles",problems) }
          }

          func TestUniqueRevisionIDCollisionLimit(t *testing.T) {
          \tnow:=time.Date(2026,9,21,12,0,0,0,time.UTC); m:=Manager{HistoryDir:t.TempDir(),Now:func() time.Time{return now}}
          \tif err:=os.MkdirAll(m.revisionsDir(),0o700); err!=nil { t.Fatal(err) }
          \thash:=strings.Repeat("a",64); base:=fmt.Sprintf("cfg-%s-%s",now.Format("20060102T150405Z"),hash[:8])
          \tfor n:=0;n<maxRevisionIDAttempts;n++ { id:=base; if n>0{id=fmt.Sprintf("%s-%d",base,n)}; if err:=os.Mkdir(filepath.Join(m.revisionsDir(),id),0o700);err!=nil{t.Fatal(err)} }
          \tif _,err:=m.uniqueRevisionID(hash); err==nil || !strings.Contains(err.Error(),"unable to allocate unique revision id") { t.Fatalf("unexpected error: %v",err) }
          }
          ''')

          p=Path('docs/SECURITY.md'); s=p.read_text()
          start=s.index('## 17. Service users'); end=s.index('\n## 18. State integrity',start)
          section='''## 17. Service identity and sandboxing

          The v0.1 agent intentionally runs as root because the controller must request local NUT FSD, perform network/Wake-on-LAN operations, and maintain protected transaction state. A non-root service identity is therefore not claimed for this release.

          Privilege is constrained with systemd sandboxing instead: `NoNewPrivileges`, strict filesystem protection, explicit writable project paths, restricted address families, kernel/control-group protections, namespace/SUID restrictions, a system-service syscall allowlist, and a bounded capability set. SSH keys and `known_hosts` are pinned under `/etc/cockpit-ups-wol/` so `ProtectHome=yes` cannot hide them.

          Any future split into an unprivileged policy process plus a narrow privileged helper must preserve the same fail-closed behavior and durable transaction semantics.
          '''
          p.write_text(s[:start]+section+s[end:])

          p=Path('scripts/test/installer-unit.sh'); s=p.read_text(); marker="echo 'installer-unit: PASS'"
          checks='''# Agent sandbox directives are part of the release contract.
          agent_unit="$(cat "$ROOT/packaging/systemd/cockpit-ups-wol-agent.service")"
          for directive in 'ProtectKernelTunables=yes' 'ProtectKernelModules=yes' 'ProtectControlGroups=yes' 'RestrictAddressFamilies=AF_UNIX AF_INET AF_INET6 AF_NETLINK' 'RestrictSUIDSGID=yes' 'RestrictNamespaces=yes' 'LockPersonality=yes' 'MemoryDenyWriteExecute=yes' 'SystemCallFilter=@system-service' 'CapabilityBoundingSet=CAP_NET_RAW CAP_NET_BROADCAST CAP_NET_ADMIN CAP_KILL CAP_SYS_BOOT'; do
            assert_contains "$agent_unit" "$directive"
          done

          echo 'installer-unit: PASS' '''
          if marker not in s: raise SystemExit('installer PASS marker missing')
          p.write_text(s.replace(marker,checks,1))

          p=Path('scripts/test/install-e2e.sh'); s=p.read_text()
          old='''sudo systemctl is-active --quiet cockpit-ups-wol-agent.service
          sudo systemctl is-enabled --quiet cockpit-ups-wol-health.timer'''
          new='''sudo systemctl is-active --quiet cockpit-ups-wol-agent.service
          sudo systemd-analyze verify /etc/systemd/system/cockpit-ups-wol-agent.service
          sudo systemd-analyze security --no-pager cockpit-ups-wol-agent.service
          sudo systemctl is-enabled --quiet cockpit-ups-wol-health.timer'''
          if old not in s: raise SystemExit('e2e systemd insertion point missing')
          p.write_text(s.replace(old,new,1))
          PY

          gofmt -w agent/internal/ipc/server.go agent/internal/ipc/server_test.go agent/internal/app/runtime.go agent/internal/app/armed.go agent/internal/config/config.go agent/internal/config/revision.go agent/internal/config/review_cleanup_test.go
          bash -n scripts/install/common.sh scripts/test/installer-unit.sh scripts/test/install-e2e.sh
          (cd agent && go test ./...)
          npm --prefix cockpit ci --ignore-scripts --no-audit --no-fund
          npm --prefix cockpit run typecheck
          npm --prefix cockpit run build
          sudo apt-get update >/dev/null
          sudo apt-get install -y --no-install-recommends shellcheck >/dev/null
          find scripts -type f -name '*.sh' -print0 | xargs -0 shellcheck -x -S error
          ./scripts/test/installer-unit.sh
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add agent cockpit/build.mjs config scripts packaging/systemd docs/SECURITY.md
          git commit -m 'fix(review): finish systemd IPC and cleanup hardening'
          git push origin HEAD:fix/review-systemd-ipc-cleanups
