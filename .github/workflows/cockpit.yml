name: Cockpit UI

on:
  push:
    branches: [main]
    paths: ['cockpit/**', 'agent/cmd/cockpit-ups-wolctl/**', 'agent/internal/report/**', 'agent/internal/config/status.go', '.github/workflows/cockpit.yml']
  pull_request:
    paths: ['cockpit/**', 'agent/cmd/cockpit-ups-wolctl/**', 'agent/internal/report/**', 'agent/internal/config/status.go', '.github/workflows/cockpit.yml']

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: cockpit
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.x'
      - name: Install exact UI dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Format check
        run: npm run format:check
      - name: Test
        run: npm test
      - name: Build Cockpit bundle
        run: npm run build
      - name: Verify bundle manifest
        run: test -s dist/index.html && test -s dist/index.js && test -s dist/index.css && test -s dist/manifest.json
