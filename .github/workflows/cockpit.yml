name: Cockpit UI

on:
  push:
    branches: [main]
    paths: ['cockpit/**', 'agent/cmd/cockpit-ups-wolctl/**', 'agent/internal/report/**', 'agent/internal/config/status.go', '.github/workflows/cockpit.yml']
  pull_request:
    paths: ['cockpit/**', 'agent/cmd/cockpit-ups-wolctl/**', 'agent/internal/report/**', 'agent/internal/config/status.go', '.github/workflows/cockpit.yml']

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cockpit
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '24.x'
      - name: Install exact UI dependencies
        run: npm install --ignore-scripts
      - name: Typecheck
        run: npm run typecheck
      - name: Build Cockpit bundle
        run: npm run build
      - name: Verify bundle manifest
        run: test -s dist/index.html && test -s dist/index.js && test -s dist/index.css && test -s dist/manifest.json
