name: apply-review-m6

on:
  push:
    branches:
      - fix/review-m6-config-validation-v2

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: fix/review-m6-config-validation-v2
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version-file: agent/go.mod
          cache-dependency-path: agent/go.sum
      - name: Apply and verify endpoint validation
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('agent/internal/config/config.go')
          s = p.read_text()
          old = '''\t\tif d.Status.Method != "none" && nilOrEmpty(d.Address) {
          \t\t\tproblems = append(problems, path+".address is required when status checks are enabled")
          \t\t}
          '''
          new = old + '''\t\tvalidateAddress(&problems, path+".address", d.Address)
          '''
          if old not in s:
              raise SystemExit('dependency address block not found')
          s = s.replace(old, new, 1)
          old = '''\t\tvalidateStatus(&problems, path+".status", h.Status)
          \t\tvalidateWake(&problems, path+".wake", h.Wake)
          \t\tif !oneOf(h.Shutdown.Method, "nut", "ssh", "command", "none") {
          '''
          new = '''\t\tvalidateStatus(&problems, path+".status", h.Status)
          \t\tvalidateWake(&problems, path+".wake", h.Wake)
          \t\tif h.Status.Method != "none" && nilOrEmpty(h.Address) {
          \t\t\tproblems = append(problems, path+".address is required when status checks are enabled")
          \t\t}
          \t\tvalidateAddress(&problems, path+".address", h.Address)
          \t\tif !oneOf(h.Shutdown.Method, "nut", "ssh", "command", "none") {
          '''
          if old not in s:
              raise SystemExit('host validation block not found')
          s = s.replace(old, new, 1)
          old = '''\t\tif nilOrEmpty(w.MAC) {
          \t\t\t*problems = append(*problems, path+".mac required when enabled")
          \t\t} else if mac, err := net.ParseMAC(*w.MAC); err != nil || len(mac) != 6 {
          \t\t\t*problems = append(*problems, path+".mac invalid")
          \t\t}
          '''
          new = old + '''\t\tvalidateIPv4(problems, path+".broadcast", w.Broadcast)
          '''
          if old not in s:
              raise SystemExit('wake validation block not found')
          s = s.replace(old, new, 1)
          p.write_text(s)
          PY
          gofmt -w agent/internal/config/config.go agent/internal/config/address_validation.go agent/internal/config/network_validation_test.go
          (cd agent && go test ./internal/config)
          rm -f .github/workflows/apply-review-m6.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix(config): validate runtime network endpoints'
          git push origin HEAD:fix/review-m6-config-validation-v2
