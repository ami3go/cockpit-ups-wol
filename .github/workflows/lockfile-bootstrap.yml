name: Bootstrap npm lockfile

on:
  pull_request:
    paths:
      - 'cockpit/package.json'
      - '.github/workflows/lockfile-bootstrap.yml'

permissions:
  contents: read

jobs:
  generate-lockfile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '24.x'
      - name: Generate lockfile from manifest
        working-directory: cockpit
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Verify lockfile is usable
        working-directory: cockpit
        run: npm ci --ignore-scripts --no-audit --no-fund
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: cockpit-package-lock
          path: cockpit/package-lock.json
          if-no-files-found: error
