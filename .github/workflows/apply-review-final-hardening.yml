name: apply-review-final-hardening

on:
  push:
    branches:
      - fix/review-systemd-ipc-cleanups

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: fix/review-systemd-ipc-cleanups
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version: '1.23.x'
          cache-dependency-path: agent/go.sum
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24.x'
      - name: Apply final hardening and cleanup
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          from pathlib import Path

          def replace(path, old, new):
              p = Path(path)
              s = p.read_text()
              if old not in s:
                  raise SystemExit(f'insertion point not found in {path}')
              p.write_text(s.replace(old, new, 1))

          Path('packaging/systemd/cockpit-ups-wol-agent.service').write_text('''[Unit]
          Description=cockpit-ups-wol power management agent
          After=network-online.target
          Wants=network-online.target
          StartLimitIntervalSec=0

          [Service]
          Type=notify
          ExecStart=/usr/libexec/cockpit-ups-wol/cockpit-ups-wol-agent --foreground
          Restart=always
          RestartSec=10s
          WatchdogSec=30s
          NotifyAccess=main
          RuntimeDirectory=cockpit-ups-wol
          StateDirectory=cockpit-ups-wol
          ConfigurationDirectory=cockpit-ups-wol
          NoNewPrivileges=yes
          PrivateTmp=yes
          ProtectHome=yes
          ProtectSystem=strict
          ProtectKernelTunables=yes
          ProtectKernelModules=yes
          ProtectControlGroups=yes
          RestrictAddressFamilies=AF_UNIX AF_INET AF_INET6 AF_NETLINK
          RestrictSUIDSGID=yes
          RestrictNamespaces=yes
          LockPersonality=yes
          MemoryDenyWriteExecute=yes
          SystemCallFilter=@system-service
          SystemCallErrorNumber=EPERM
          CapabilityBoundingSet=CAP_NET_RAW CAP_NET_BROADCAST CAP_NET_ADMIN CAP_KILL CAP_SYS_BOOT
          ReadWritePaths=/var/lib/cockpit-ups-wol /run/cockpit-ups-wol /etc/cockpit-ups-wol

          [Install]
          WantedBy=multi-user.target
          ''')

          replace('agent/internal/ipc/server.go', 's.SocketMode = 0o660', 's.SocketMode = 0o600')
          replace('agent/internal/app/runtime.go', 'SocketMode: 0o660,', 'SocketMode: 0o600,')
          replace('agent/internal/app/armed.go', 'SocketMode: 0o660,', 'SocketMode: 0o600,')

          p = Path('agent/internal/ipc/server_test.go')
          s = p.read_text()
          s = s.replace('"path/filepath"\n', '"os"\n\t"path/filepath"\n', 1)
          old = '''\t\tif err == nil {
          \t\t\tif !resp.OK {
          \t\t\t\tt.Fatalf("resp=%+v", resp)
          \t\t\t}
          \t\t\tcancel()
          '''
          new = '''\t\tif err == nil {
          \t\t\tif !resp.OK {
          \t\t\t\tt.Fatalf("resp=%+v", resp)
          \t\t\t}
          \t\t\tinfo, statErr := os.Stat(path)
          \t\t\tif statErr != nil {
          \t\t\t\tt.Fatalf("stat socket: %v", statErr)
          \t\t\t}
          \t\t\tif got := info.Mode().Perm(); got != 0o600 {
          \t\t\t\tt.Fatalf("socket mode=%#o want %#o", got, os.FileMode(0o600))
          \t\t\t}
          \t\t\tcancel()
          '''
          if old not in s:
              raise SystemExit('socket test insertion point not found')
          p.write_text(s.replace(old, new, 1))

          common = Path('scripts/install/common.sh')
          s = common.read_text()
          old = '''platform_detect(){ [[ -r /etc/os-release ]]||die "/etc/os-release not found"; source /etc/os-release; local id="${ID:-}" like="${ID_LIKE:-}"; case " $id $like " in *" debian "*|*" ubuntu "*) DISTRO_FAMILY=debian;; *" arch "*) DISTRO_FAMILY=arch;; *" fedora "*|*" rhel "*|*" centos "*) DISTRO_FAMILY=fedora;; *) die "unsupported distribution: ${ID:-unknown}";; esac; case "$(uname -m)" in x86_64|amd64) TARGET_ARCH=amd64;; aarch64|arm64) TARGET_ARCH=arm64;; riscv64) TARGET_ARCH=riscv64;; *) die "unsupported architecture: $(uname -m)";; esac; }
          '''
          new = '''platform_detect(){
            [[ -r /etc/os-release ]]||die "/etc/os-release not found"
            local detected id like
            detected="$(
              (
                # shellcheck disable=SC1091
                source /etc/os-release
                printf '%s\\n%s\\n' "${ID:-}" "${ID_LIKE:-}"
              )
            )"
            id="${detected%%$'\\n'*}"
            like="${detected#*$'\\n'}"
            case " $id $like " in
              *" debian "*|*" ubuntu "*) DISTRO_FAMILY=debian;;
              *" arch "*) DISTRO_FAMILY=arch;;
              *" fedora "*|*" rhel "*|*" centos "*) DISTRO_FAMILY=fedora;;
              *) die "unsupported distribution: ${id:-unknown}";;
            esac
            case "$(uname -m)" in
              x86_64|amd64) TARGET_ARCH=amd64;;
              aarch64|arm64) TARGET_ARCH=arm64;;
              riscv64) TARGET_ARCH=riscv64;;
              *) die "unsupported architecture: $(uname -m)";;
            esac
          }
          '''
          if old not in s:
              raise SystemExit('platform_detect insertion point not found')
          common.write_text(s.replace(old, new, 1))

          replace('cockpit/build.mjs', '  sourcemap: true,', '  sourcemap: false,')

          fixture = Path('config/config.yaml.example').read_text()
          testdata = Path('agent/internal/config/testdata')
          testdata.mkdir(parents=True, exist_ok=True)
          (testdata / 'config.yaml.example').write_text(fixture)
          for path, old, new in [
              ('agent/internal/config/bootstrap_test.go', '../../../config/config.yaml.example', 'testdata/config.yaml.example'),
              ('agent/internal/config/yaml_integration_test.go', '../../../config/config.yaml.example', 'testdata/config.yaml.example'),
              ('agent/internal/report/report_test.go', '../../../config/config.yaml.example', '../config/testdata/config.yaml.example'),
          ]:
              p = Path(path)
              text = p.read_text()
              if old not in text:
                  raise SystemExit(f'fixture path not found in {path}')
              p.write_text(text.replace(old, new))

          config = Path('agent/internal/config/config.go')
          s = config.read_text()
          old = '''\tvar visit func(string) bool
          \tvisit = func(id string) bool {
          \t\tswitch marks[id] {
          \t\tcase visiting:
          \t\t\tstart := 0
          \t\t\tfor i, v := range stack {
          \t\t\t\tif v == id {
          \t\t\t\t\tstart = i
          \t\t\t\t\tbreak
          \t\t\t\t}
          \t\t\t}
          \t\t\tcycle := append(append([]string(nil), stack[start:]...), id)
          \t\t\t*problems = append(*problems, "recovery dependency cycle detected: "+strings.Join(cycle, " -> "))
          \t\t\treturn false
          \t\tcase visited:
          \t\t\treturn true
          \t\t}

          \t\tmarks[id] = visiting
          \t\tstack = append(stack, id)
          \t\tfor _, dep := range graph[id] {
          \t\t\tif _, managedHost := graph[dep]; !managedHost {
          \t\t\t\tcontinue
          \t\t\t}
          \t\t\tif !visit(dep) {
          \t\t\t\treturn false
          \t\t\t}
          \t\t}
          \t\tstack = stack[:len(stack)-1]
          \t\tmarks[id] = visited
          \t\treturn true
          \t}

          \tfor id := range graph {
          \t\tif marks[id] == unvisited && !visit(id) {
          \t\t\treturn
          \t\t}
          \t}
          '''
          new = '''\tvar visit func(string)
          \tvisit = func(id string) {
          \t\tswitch marks[id] {
          \t\tcase visiting:
          \t\t\tstart := 0
          \t\t\tfor i, v := range stack {
          \t\t\t\tif v == id {
          \t\t\t\t\tstart = i
          \t\t\t\t\tbreak
          \t\t\t\t}
          \t\t\t}
          \t\t\tcycle := append(append([]string(nil), stack[start:]...), id)
          \t\t\t*problems = append(*problems, "recovery dependency cycle detected: "+strings.Join(cycle, " -> "))
          \t\t\treturn
          \t\tcase visited:
          \t\t\treturn
          \t\t}

          \t\tmarks[id] = visiting
          \t\tstack = append(stack, id)
          \t\tfor _, dep := range graph[id] {
          \t\t\tif _, managedHost := graph[dep]; !managedHost {
          \t\t\t\tcontinue
          \t\t\t}
          \t\t\tvisit(dep)
          \t\t}
          \t\tstack = stack[:len(stack)-1]
          \t\tmarks[id] = visited
          \t}

          \tfor id := range graph {
          \t\tif marks[id] == unvisited {
          \t\t\tvisit(id)
          \t\t}
          \t}
          '''
          if old not in s:
              raise SystemExit('cycle validator insertion point not found')
          config.write_text(s.replace(old, new, 1))

          revision = Path('agent/internal/config/revision.go')
          s = revision.read_text()
          old = '''\tid := m.uniqueRevisionID(hexsum)
          \tparent, _ := m.readPointer("active")
          '''
          new = '''\tid, err := m.uniqueRevisionID(hexsum)
          \tif err != nil {
          \t\treturn Manifest{}, err
          \t}
          \tparent, _ := m.readPointer("active")
          '''
          if old not in s:
              raise SystemExit('revision caller insertion point not found')
          s = s.replace(old, new, 1)
          old = '''func (m *Manager) uniqueRevisionID(contentHash string) string {
          \tbase := fmt.Sprintf("cfg-%s-%s", m.Now().UTC().Format("20060102T150405Z"), contentHash[:8])
          \tid := base
          \tfor n := 1; ; n++ {
          \t\tif _, err := os.Stat(m.revisionDir(id)); errors.Is(err, os.ErrNotExist) {
          \t\t\treturn id
          \t\t}
          \t\tid = fmt.Sprintf("%s-%d", base, n)
          \t}
          }
          '''
          new = '''const maxRevisionIDAttempts = 100

          func (m *Manager) uniqueRevisionID(contentHash string) (string, error) {
          \tif len(contentHash) < 8 {
          \t\treturn "", errors.New("content hash is too short to allocate revision id")
          \t}
          \tbase := fmt.Sprintf("cfg-%s-%s", m.Now().UTC().Format("20060102T150405Z"), contentHash[:8])
          \tfor n := 0; n < maxRevisionIDAttempts; n++ {
          \t\tid := base
          \t\tif n > 0 {
          \t\t\tid = fmt.Sprintf("%s-%d", base, n)
          \t\t}
          \t\t_, err := os.Stat(m.revisionDir(id))
          \t\tif errors.Is(err, os.ErrNotExist) {
          \t\t\treturn id, nil
          \t\t}
          \t\tif err != nil {
          \t\t\treturn "", fmt.Errorf("check revision id %q: %w", id, err)
          \t\t}
          \t}
          \treturn "", fmt.Errorf("unable to allocate unique revision id after %d attempts", maxRevisionIDAttempts)
          }
          '''
          if old not in s:
              raise SystemExit('uniqueRevisionID insertion point not found')
          revision.write_text(s.replace(old, new, 1))

          Path('agent/internal/config/review_cleanup_test.go').write_text('''package config

          import (
          \t"fmt"
          \t"os"
          \t"path/filepath"
          \t"strings"
          \t"testing"
          \t"time"
          )

          func TestDependencyValidationReportsIndependentCycles(t *testing.T) {
          \thosts := []HostConfig{
          \t\t{ID: "a", DependsOn: []string{"b"}},
          \t\t{ID: "b", DependsOn: []string{"a"}},
          \t\t{ID: "c", DependsOn: []string{"d"}},
          \t\t{ID: "d", DependsOn: []string{"c"}},
          \t}
          \tvar problems []string
          \tvalidateHostDependencyCycles(&problems, hosts)
          \tcount := 0
          \tfor _, problem := range problems {
          \t\tif strings.Contains(problem, "recovery dependency cycle detected") {
          \t\t\tcount++
          \t\t}
          \t}
          \tif count != 2 {
          \t\tt.Fatalf("cycle problems=%v want 2 independent cycles", problems)
          \t}
          }

          func TestUniqueRevisionIDCollisionLimit(t *testing.T) {
          \tdir := t.TempDir()
          \tnow := time.Date(2026, 9, 21, 12, 0, 0, 0, time.UTC)
          \tm := Manager{HistoryDir: dir, Now: func() time.Time { return now }}
          \tif err := os.MkdirAll(m.revisionsDir(), 0o700); err != nil {
          \t\tt.Fatal(err)
          \t}
          \thash := strings.Repeat("a", 64)
          \tbase := fmt.Sprintf("cfg-%s-%s", now.Format("20060102T150405Z"), hash[:8])
          \tfor n := 0; n < maxRevisionIDAttempts; n++ {
          \t\tid := base
          \t\tif n > 0 {
          \t\t\tid = fmt.Sprintf("%s-%d", base, n)
          \t\t}
          \t\tif err := os.Mkdir(filepath.Join(m.revisionsDir(), id), 0o700); err != nil {
          \t\t\tt.Fatal(err)
          \t\t}
          \t}
          \tif _, err := m.uniqueRevisionID(hash); err == nil || !strings.Contains(err.Error(), "unable to allocate unique revision id") {
          \t\tt.Fatalf("expected bounded collision error, got %v", err)
          \t}
          }
          ''')

          security = Path('docs/SECURITY.md')
          s = security.read_text()
          old = '''## 17. Service users

          Where practical:

          - agent runs under a dedicated service identity
          - privileged operations are isolated to the smallest necessary path
          - filesystem permissions restrict config/state/secrets
          - systemd hardening options are applied without breaking required NUT/IPC/network behavior

          Candidate hardening settings include:

          ```text
          NoNewPrivileges=yes
          PrivateTmp=yes
          ProtectHome=yes
          ProtectSystem=strict
          RestrictAddressFamilies=...
          ReadWritePaths=project-owned paths
          ```

          Exact settings require integration testing.
          '''
          new = '''## 17. Service identity and sandboxing

          The v0.1 agent intentionally runs as root because the controller must request local NUT FSD, perform network/Wake-on-LAN operations, and maintain protected transaction state. A non-root service identity is therefore not claimed for this release.

          Privilege is constrained with systemd sandboxing instead: `NoNewPrivileges`, strict filesystem protection, explicit writable project paths, restricted address families, kernel/control-group protections, namespace/SUID restrictions, a system-service syscall allowlist, and a bounded capability set. SSH keys and `known_hosts` are pinned under `/etc/cockpit-ups-wol/` so `ProtectHome=yes` cannot hide them.

          Any future split into an unprivileged policy process plus a narrow privileged helper must preserve the same fail-closed behavior and durable transaction semantics.
          '''
          if old not in s:
              raise SystemExit('SECURITY section insertion point not found')
          security.write_text(s.replace(old, new, 1))

          unit_test = Path('scripts/test/installer-unit.sh')
          s = unit_test.read_text()
          marker = "echo 'installer-unit: PASS'"
          checks = '''# The safety agent is intentionally root but must remain tightly sandboxed.
          agent_unit="$(cat "$ROOT/packaging/systemd/cockpit-ups-wol-agent.service")"
          for directive in \\
            'ProtectKernelTunables=yes' \\
            'ProtectKernelModules=yes' \\
            'ProtectControlGroups=yes' \\
            'RestrictAddressFamilies=AF_UNIX AF_INET AF_INET6 AF_NETLINK' \\
            'RestrictSUIDSGID=yes' \\
            'RestrictNamespaces=yes' \\
            'LockPersonality=yes' \\
            'MemoryDenyWriteExecute=yes' \\
            'SystemCallFilter=@system-service' \\
            'CapabilityBoundingSet=CAP_NET_RAW CAP_NET_BROADCAST CAP_NET_ADMIN CAP_KILL CAP_SYS_BOOT'; do
            assert_contains "$agent_unit" "$directive"
          done
          if command -v systemd-analyze >/dev/null 2>&1; then
            systemd-analyze verify "$ROOT/packaging/systemd/cockpit-ups-wol-agent.service" >/dev/null
          fi

          echo 'installer-unit: PASS' '''
          if marker not in s:
              raise SystemExit('installer unit marker not found')
          unit_test.write_text(s.replace(marker, checks, 1))
          PY

          gofmt -w agent/internal/ipc/server.go agent/internal/ipc/server_test.go agent/internal/app/runtime.go agent/internal/app/armed.go agent/internal/config/config.go agent/internal/config/revision.go agent/internal/config/review_cleanup_test.go
          bash -n scripts/install/common.sh scripts/test/installer-unit.sh
          (cd agent && go test ./...)
          npm --prefix cockpit ci --ignore-scripts --no-audit --no-fund
          npm --prefix cockpit run typecheck
          npm --prefix cockpit run build
          sudo apt-get update >/dev/null
          sudo apt-get install -y --no-install-recommends shellcheck >/dev/null
          find scripts -type f -name '*.sh' -print0 | xargs -0 shellcheck -x -S error
          ./scripts/test/installer-unit.sh
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add agent cockpit/build.mjs config scripts packaging/systemd docs/SECURITY.md
          git commit -m 'fix(review): finish systemd IPC and cleanup hardening'
          git push origin HEAD:fix/review-systemd-ipc-cleanups
