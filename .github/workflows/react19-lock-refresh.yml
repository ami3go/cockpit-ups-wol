name: React 19 lockfile refresh

on:
  pull_request:
    paths:
      - 'cockpit/package.json'
      - 'cockpit/package-lock.json'
      - '.github/workflows/react19-lock-refresh.yml'

permissions:
  contents: write

jobs:
  refresh-lockfile:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'deps/react19'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.head_ref }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24.x'
      - name: Regenerate exact npm lockfile
        working-directory: cockpit
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Verify regenerated dependency graph
        working-directory: cockpit
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Commit lockfile when changed
        run: |
          git add cockpit/package-lock.json
          if git diff --cached --quiet; then
            echo 'package-lock.json already current'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'build(deps): refresh React 19 lockfile'
          git push origin HEAD:${{ github.head_ref }}
