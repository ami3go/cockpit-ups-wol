name: fix-rereview-r1
on:
  push:
    branches: [fix/rereview-r1-fsd-sandbox]
    paths:
      - '.github/workflows/_fix-rereview-r1.yml'
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: fix/rereview-r1-fsd-sandbox
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version: '1.26.x'
          cache-dependency-path: agent/go.sum
      - name: Apply patch
        run: python3 .github/scripts/_apply_r1.py
      - name: Format and test
        run: |
          gofmt -w agent/internal/orchestrator/controller.go agent/internal/orchestrator/nut_fsd_retry_test.go
          cd agent
          go test ./internal/orchestrator/...
      - name: Shell syntax
        run: |
          for f in scripts/install/common.sh scripts/install/transaction.sh scripts/install/recover-interrupted-install.sh scripts/test/install-e2e.sh; do
            bash -n "$f"
          done
      - name: Commit patch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add agent/internal/orchestrator scripts/install scripts/test/install-e2e.sh
          git commit -m 'fix(armed): restore NUT FSD under hardened sandbox'
          git push origin HEAD:fix/rereview-r1-fsd-sandbox
