name: fix-rereview-r1
on:
  push:
    branches: [fix/rereview-r1-fsd-sandbox]
    paths: ['.github/workflows/_fix-rereview-r1.yml']
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: fix/rereview-r1-fsd-sandbox
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version: '1.26.x'
          cache-dependency-path: agent/go.sum
      - name: Apply R1 fix and regressions
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          from pathlib import Path

          def replace(path, old, new, count=1):
              p = Path(path)
              s = p.read_text()
              if old not in s:
                  raise SystemExit(f'missing expected text in {path}: {old[:120]!r}')
              p.write_text(s.replace(old, new, count))

          # Installer: resolve the NUT runtime group after packages are installed and
          # add it narrowly as a supplementary group for the safety agent.
          p = Path('scripts/install/common.sh')
          s = p.read_text()
          old = '''install_systemd_units(){
  install -m0644 "$SELF_DIR/packaging/systemd/cockpit-ups-wol-agent.service" "$SYSTEMD_DIR/"
  install -m0644 "$SELF_DIR/packaging/systemd/cockpit-ups-wol-health.service" "$SYSTEMD_DIR/"
  install -m0644 "$SELF_DIR/packaging/systemd/cockpit-ups-wol-health.timer" "$SYSTEMD_DIR/"
  install -m0644 "$SELF_DIR/packaging/systemd/cockpit-ups-wol-firewall.service" "$SYSTEMD_DIR/"
  install -m0644 "$SELF_DIR/packaging/systemd/cockpit-ups-wol-install-recover.service" "$SYSTEMD_DIR/"
}
'''
          new = '''nut_runtime_group(){
  local group=""
  if [[ -d /run/nut ]]; then
    group="$(stat -c %G /run/nut 2>/dev/null || true)"
    [[ "$group" != UNKNOWN ]] || group=""
  fi
  if [[ -z "$group" ]] && id nut >/dev/null 2>&1; then
    group="$(id -gn nut)"
  fi
  if [[ -z "$group" ]] && getent group nut >/dev/null 2>&1; then
    group=nut
  fi
  [[ -n "$group" && "$group" =~ ^[A-Za-z0-9_.-]+$ ]] || die "cannot determine NUT runtime group for upsmon PID access"
  printf '%s\\n' "$group"
}
install_nut_runtime_group_dropin(){
  local group dropin_dir="$SYSTEMD_DIR/cockpit-ups-wol-agent.service.d"
  group="$(nut_runtime_group)"
  install -d -m0755 "$dropin_dir"
  printf '[Service]\\nSupplementaryGroups=%s\\n' "$group" >"$dropin_dir/10-nut-runtime-group.conf"
  chmod 0644 "$dropin_dir/10-nut-runtime-group.conf"
  log "agent NUT runtime group: $group"
}
install_systemd_units(){
  install -m0644 "$SELF_DIR/packaging/systemd/cockpit-ups-wol-agent.service" "$SYSTEMD_DIR/"
  install -m0644 "$SELF_DIR/packaging/systemd/cockpit-ups-wol-health.service" "$SYSTEMD_DIR/"
  install -m0644 "$SELF_DIR/packaging/systemd/cockpit-ups-wol-health.timer" "$SYSTEMD_DIR/"
  install -m0644 "$SELF_DIR/packaging/systemd/cockpit-ups-wol-firewall.service" "$SYSTEMD_DIR/"
  install -m0644 "$SELF_DIR/packaging/systemd/cockpit-ups-wol-install-recover.service" "$SYSTEMD_DIR/"
  install_nut_runtime_group_dropin
}
'''
          if old not in s:
              raise SystemExit('install_systemd_units block not found')
          p.write_text(s.replace(old, new, 1))

          # The dynamic drop-in is transaction-owned and must roll back with the unit.
          replace('scripts/install/transaction.sh',
                  '"$SYSTEMD_DIR/cockpit-ups-wol-agent.service" "$SYSTEMD_DIR/cockpit-ups-wol-health.service"',
                  '"$SYSTEMD_DIR/cockpit-ups-wol-agent.service" "$SYSTEMD_DIR/cockpit-ups-wol-agent.service.d" "$SYSTEMD_DIR/cockpit-ups-wol-health.service"',
                  2)
          replace('scripts/install/recover-interrupted-install.sh',
                  '  "$SYSTEMD_DIR/cockpit-ups-wol-agent.service" \\\n  "$SYSTEMD_DIR/cockpit-ups-wol-health.service"',
                  '  "$SYSTEMD_DIR/cockpit-ups-wol-agent.service" \\\n  "$SYSTEMD_DIR/cockpit-ups-wol-agent.service.d" \\\n  "$SYSTEMD_DIR/cockpit-ups-wol-health.service"')

          # Orchestrator: NUT FSD failure is a durable retry condition, not a process-fatal error.
          replace('agent/internal/orchestrator/controller.go',
                  'const maxDirectShutdownAttempts = 3',
                  '''const (
\tmaxDirectShutdownAttempts = 3
\tmaxNUTFSDShutdownAttempts = 6
)''')
          replace('agent/internal/orchestrator/controller.go',
                  '\tresumeWakeDelayEvaluated bool\n}',
                  '\tresumeWakeDelayEvaluated bool\n\n\tnutFSDTransactionID string\n\tnutFSDNextAttempt   time.Time\n}')
          p = Path('agent/internal/orchestrator/controller.go')
          s = p.read_text().replace('c.executeShutdown(ctx)', 'c.executeShutdown(ctx, now)')
          s = s.replace('func (c *Controller) executeShutdown(ctx context.Context) error {', 'func (c *Controller) executeShutdown(ctx context.Context, now time.Time) error {')
          p.write_text(s)

          old = '''\tif len(plan.NUTGroup) > 0 {
\t\tif c.FSD == nil {
\t\t\treturn errors.New("FSD requester is required for NUT-managed hosts")
\t\t}
\t\tif c.Config.NUT.Profile == "remote-client" {
\t\t\treturn errors.New("remote-client profile cannot request FSD")
\t\t}
\t\tif err := c.prepareNUTGroup(ctx, plan.NUTGroup, byID); err != nil {
\t\t\treturn err
\t\t}
\t\tif err := c.FSD.RequestFSD(ctx, c.Config.NUT.UPSName, c.upsmonPath()); err != nil {
\t\t\tpersistErr := c.markNUTError(plan.NUTGroup, err)
\t\t\tif persistErr != nil {
\t\t\t\treturn errors.Join(fmt.Errorf("request FSD: %w", err), fmt.Errorf("persist NUT FSD failure state: %w", persistErr))
\t\t\t}
\t\t\treturn fmt.Errorf("request FSD: %w", err)
\t\t}
\t\tif err := c.markNUTAcknowledged(plan.NUTGroup); err != nil {
\t\t\treturn fmt.Errorf("persist NUT FSD acknowledgement: %w", err)
\t\t}
\t\tif err := c.verifyNUTGroup(ctx, plan.NUTGroup, byID); err != nil {
\t\t\treturn fmt.Errorf("persist NUT shutdown verification: %w", err)
\t\t}
\t}
'''
          new = '''\tif len(plan.NUTGroup) > 0 {
\t\tif c.FSD == nil {
\t\t\treturn errors.New("FSD requester is required for NUT-managed hosts")
\t\t}
\t\tif c.Config.NUT.Profile == "remote-client" {
\t\t\treturn errors.New("remote-client profile cannot request FSD")
\t\t}
\t\tif err := c.prepareNUTGroup(ctx, plan.NUTGroup, byID); err != nil {
\t\t\treturn err
\t\t}
\t\tattempts := c.maxNUTAttempts(plan.NUTGroup)
\t\tif attempts >= maxNUTFSDShutdownAttempts {
\t\t\treturn c.enterNUTGroupFailedSafe(plan.NUTGroup, fmt.Sprintf("NUT FSD exhausted %d attempts; native upsmon low-battery shutdown remains the fallback", maxNUTFSDShutdownAttempts))
\t\t}
\t\ttx := c.Policy.State().TransactionID
\t\tif !c.shouldAttemptNUTFSD(now, tx) {
\t\t\treturn nil
\t\t}
\t\tif err := c.markNUTRequested(plan.NUTGroup); err != nil {
\t\t\treturn fmt.Errorf("persist NUT FSD request state: %w", err)
\t\t}
\t\tif err := c.FSD.RequestFSD(ctx, c.Config.NUT.UPSName, c.upsmonPath()); err != nil {
\t\t\tpersistErr := c.markNUTError(plan.NUTGroup, err)
\t\t\tif persistErr != nil {
\t\t\t\treturn errors.Join(fmt.Errorf("request FSD: %w", err), fmt.Errorf("persist NUT FSD failure state: %w", persistErr))
\t\t\t}
\t\t\tc.scheduleNUTFSDRetry(now, tx, attempts+1)
\t\t\treturn nil
\t\t}
\t\tc.clearNUTFSDRetry(tx)
\t\tif err := c.markNUTAcknowledged(plan.NUTGroup); err != nil {
\t\t\treturn fmt.Errorf("persist NUT FSD acknowledgement: %w", err)
\t\t}
\t\tif err := c.verifyNUTGroup(ctx, plan.NUTGroup, byID); err != nil {
\t\t\treturn fmt.Errorf("persist NUT shutdown verification: %w", err)
\t\t}
\t}
'''
          replace('agent/internal/orchestrator/controller.go', old, new)

          old = '''func (c *Controller) prepareNUTGroup(ctx context.Context, ids []string, byID map[string]config.HostConfig) error {
\tfor _, id := range ids {
\t\th := byID[id]
\t\ths := c.Policy.State().Hosts[id]
\t\tif hs.ShutdownState == state.ShutdownCompleted {
\t\t\tcontinue
\t\t}
\t\tif h.Address != nil && h.Status.Method != "none" {
\t\t\tres, err := c.Probe.Check(ctx, h)
\t\t\tif err == nil && res.Known && !res.Online {
\t\t\t\ths.ShutdownState = state.ShutdownCompleted
\t\t\t\ths.LastVerification = "offline"
\t\t\t\tif err := c.persistHost(id, hs); err != nil {
\t\t\t\t\treturn err
\t\t\t\t}
\t\t\t\tcontinue
\t\t\t}
\t\t}
\t\ths.ShutdownAttempts++
\t\ths.ShutdownState = state.ShutdownRequested
\t\ths.LastActionID = fmt.Sprintf("fsd:%s:%s:%d", c.Policy.State().TransactionID, id, hs.ShutdownAttempts)
\t\tif err := c.persistHost(id, hs); err != nil {
\t\t\treturn err
\t\t}
\t}
\treturn nil
}
'''
          new = '''func (c *Controller) prepareNUTGroup(ctx context.Context, ids []string, byID map[string]config.HostConfig) error {
\tfor _, id := range ids {
\t\th := byID[id]
\t\ths := c.Policy.State().Hosts[id]
\t\tif hs.ShutdownState == state.ShutdownCompleted {
\t\t\tcontinue
\t\t}
\t\tif h.Address != nil && h.Status.Method != "none" {
\t\t\tres, err := c.Probe.Check(ctx, h)
\t\t\tif err == nil && res.Known && !res.Online {
\t\t\t\ths.ShutdownState = state.ShutdownCompleted
\t\t\t\ths.LastVerification = "offline"
\t\t\t\tif err := c.persistHost(id, hs); err != nil {
\t\t\t\t\treturn err
\t\t\t\t}
\t\t\t}
\t\t}
\t}
\treturn nil
}

func (c *Controller) markNUTRequested(ids []string) error {
\tvar errs []error
\tfor _, id := range ids {
\t\ths := c.Policy.State().Hosts[id]
\t\tif hs.ShutdownState == state.ShutdownCompleted {
\t\t\tcontinue
\t\t}
\t\ths.ShutdownAttempts++
\t\ths.ShutdownState = state.ShutdownRequested
\t\ths.LastActionID = fmt.Sprintf("fsd:%s:%s:%d", c.Policy.State().TransactionID, id, hs.ShutdownAttempts)
\t\ths.LastError = ""
\t\tif err := c.persistHost(id, hs); err != nil {
\t\t\terrs = append(errs, fmt.Errorf("persist %s NUT request: %w", id, err))
\t\t}
\t}
\treturn errors.Join(errs...)
}

func (c *Controller) maxNUTAttempts(ids []string) int {
\tmaxAttempts := 0
\tfor _, id := range ids {
\t\tif n := c.Policy.State().Hosts[id].ShutdownAttempts; n > maxAttempts {
\t\t\tmaxAttempts = n
\t\t}
\t}
\treturn maxAttempts
}

func (c *Controller) shouldAttemptNUTFSD(now time.Time, transactionID string) bool {
\tif c.nutFSDTransactionID != transactionID {
\t\tc.nutFSDTransactionID = transactionID
\t\tc.nutFSDNextAttempt = time.Time{}
\t}
\treturn c.nutFSDNextAttempt.IsZero() || !now.Before(c.nutFSDNextAttempt)
}

func (c *Controller) scheduleNUTFSDRetry(now time.Time, transactionID string, attempt int) {
\tif c.nutFSDTransactionID != transactionID {
\t\tc.nutFSDTransactionID = transactionID
\t}
\tdelay := 5 * time.Second
\tfor i := 1; i < attempt && delay < time.Minute; i++ {
\t\tdelay *= 2
\t}
\tif delay > time.Minute {
\t\tdelay = time.Minute
\t}
\tc.nutFSDNextAttempt = now.Add(delay)
}

func (c *Controller) clearNUTFSDRetry(transactionID string) {
\tc.nutFSDTransactionID = transactionID
\tc.nutFSDNextAttempt = time.Time{}
}

func (c *Controller) enterNUTGroupFailedSafe(ids []string, reason string) error {
\tst := cloneState(c.Policy.State())
\tfor _, id := range ids {
\t\ths := st.Hosts[id]
\t\tif hs.ShutdownState == state.ShutdownCompleted {
\t\t\tcontinue
\t\t}
\t\ths.ShutdownState = state.ShutdownFailed
\t\ths.LastError = reason
\t\tst.Hosts[id] = hs
\t}
\tst.PowerState = state.FailedSafe
\tst.FailedSafeReason = reason
\t_, err := c.Policy.Write(st)
\treturn err
}
'''
          replace('agent/internal/orchestrator/controller.go', old, new)

          # E2E: prove the installed service's actual sandbox can traverse the
          # distro-owned NUT runtime directory and signal upsmon's PID path.
          replace('scripts/test/install-e2e.sh',
                  'cleanup(){ sudo systemctl stop nut-driver.target nut-server.service >/dev/null 2>&1||true; }',
                  'cleanup(){ [[ -z "${FSD_VICTIM:-}" ]] || kill "$FSD_VICTIM" >/dev/null 2>&1 || true; sudo systemctl stop nut-driver.target nut-server.service >/dev/null 2>&1||true; }')
          marker = '''awk -v score="$SYSTEMD_EXPOSURE" 'BEGIN { exit !((score + 0) <= 3.5) }' || { echo "systemd exposure score $SYSTEMD_EXPOSURE exceeds maximum 3.5" >&2; exit 1; }
'''
          addition = marker + '''NUT_GROUP="$(stat -c %G /run/nut)"
[[ -n "$NUT_GROUP" && "$NUT_GROUP" != UNKNOWN ]]
AGENT_GROUPS="$(systemctl show -P SupplementaryGroups cockpit-ups-wol-agent.service)"
case " $AGENT_GROUPS " in *" $NUT_GROUP "*) ;; *) echo "agent missing NUT supplementary group $NUT_GROUP" >&2; exit 1 ;; esac
UPSMON_BIN="$(command -v upsmon || true)"
[[ -x "$UPSMON_BIN" ]] || UPSMON_BIN=/lib/nut/upsmon
[[ -x "$UPSMON_BIN" ]] || { echo 'upsmon binary not found' >&2; exit 1; }
sleep 300 & FSD_VICTIM=$!
printf '%s\\n' "$FSD_VICTIM" | sudo tee /run/nut/upsmon.pid >/dev/null
sudo chown nut:"$NUT_GROUP" /run/nut/upsmon.pid
sudo chmod 0644 /run/nut/upsmon.pid
props=()
for prop in CapabilityBoundingSet SupplementaryGroups NoNewPrivileges ProtectSystem ProtectHome; do
  value="$(systemctl show -P "$prop" cockpit-ups-wol-agent.service)"
  [[ -n "$value" ]] && props+=(-p "$prop=$value")
done
sudo systemd-run --quiet --wait --pipe --collect --unit=cockpit-ups-wol-fsd-sandbox-test "${props[@]}" "$UPSMON_BIN" -c fsd
sleep 0.2
if kill -0 "$FSD_VICTIM" 2>/dev/null; then
  echo 'agent sandbox cannot deliver upsmon FSD signal through /run/nut' >&2
  exit 1
fi
wait "$FSD_VICTIM" 2>/dev/null || true
FSD_VICTIM=""
'''
          replace('scripts/test/install-e2e.sh', marker, addition)
          PY

          cat > agent/internal/orchestrator/nut_fsd_retry_test.go <<'EOF'
          package orchestrator

          import (
          	"context"
          	"errors"
          	"testing"
          	"time"

          	"github.com/ami3go/cockpit-ups-wol/agent/internal/host"
          	"github.com/ami3go/cockpit-ups-wol/agent/internal/nut"
          	"github.com/ami3go/cockpit-ups-wol/agent/internal/policy"
          	"github.com/ami3go/cockpit-ups-wol/agent/internal/state"
          )

          type failingFSD struct{ calls int }

          func (f *failingFSD) RequestFSD(context.Context, string, string) error {
          	f.calls++
          	return errors.New("fsd unavailable")
          }

          func TestNUTFSDFailureRetriesWithoutKillingController(t *testing.T) {
          	events := []string{}
          	cfg := testConfig()
          	cfg.Hosts = cfg.Hosts[1:]
          	st := state.New("outage-1", "cfg")
          	st.PowerState = state.ShutdownInProgress
          	st.ShutdownCommitted = true
          	wasOnline := true
          	st.Hosts["nas"] = state.HostState{WasOnline: &wasOnline, ShutdownState: state.ShutdownPlanned, RecoveryState: state.RecoveryWaiting}
          	store := &memoryStore{st: st, events: &events}
          	coord := policy.NewCoordinator(policy.New(policyConfig(cfg), st), store)
          	if _, err := coord.Write(st); err != nil {
          		t.Fatal(err)
          	}
          	probe := &fakeProbe{online: map[string]bool{"nas": true}}
          	fsd := &failingFSD{}
          	ctl := &Controller{Config: cfg, Policy: coord, Probe: probe, Shutdown: fakeShutdown{&events}, FSD: fsd}
          	now := time.Unix(1000, 0)
          	in := policy.Inputs{UPS: nut.Status{Utility: nut.UtilityOnBattery}, NetworkReady: true, HealthSafe: true}

          	if _, err := ctl.Tick(context.Background(), now, in); err != nil {
          		t.Fatalf("FSD transport failure must be retryable, got %v", err)
          	}
          	if fsd.calls != 1 || coord.State().Hosts["nas"].ShutdownAttempts != 1 {
          		t.Fatalf("after first attempt calls=%d attempts=%d", fsd.calls, coord.State().Hosts["nas"].ShutdownAttempts)
          	}
          	if _, err := ctl.Tick(context.Background(), now.Add(time.Second), in); err != nil {
          		t.Fatal(err)
          	}
          	if fsd.calls != 1 || coord.State().Hosts["nas"].ShutdownAttempts != 1 {
          		t.Fatalf("retry backoff ignored: calls=%d attempts=%d", fsd.calls, coord.State().Hosts["nas"].ShutdownAttempts)
          	}
          	if _, err := ctl.Tick(context.Background(), now.Add(6*time.Second), in); err != nil {
          		t.Fatal(err)
          	}
          	if fsd.calls != 2 || coord.State().Hosts["nas"].ShutdownAttempts != 2 {
          		t.Fatalf("scheduled retry missing: calls=%d attempts=%d", fsd.calls, coord.State().Hosts["nas"].ShutdownAttempts)
          	}
          }

          func TestNUTFSDRetriesAreBoundedAcrossDurableAttempts(t *testing.T) {
          	events := []string{}
          	cfg := testConfig()
          	cfg.Hosts = cfg.Hosts[1:]
          	st := state.New("outage-1", "cfg")
          	st.PowerState = state.ShutdownInProgress
          	st.ShutdownCommitted = true
          	wasOnline := true
          	st.Hosts["nas"] = state.HostState{WasOnline: &wasOnline, ShutdownState: state.ShutdownUnknown, RecoveryState: state.RecoveryWaiting, ShutdownAttempts: maxNUTFSDShutdownAttempts}
          	store := &memoryStore{st: st, events: &events}
          	coord := policy.NewCoordinator(policy.New(policyConfig(cfg), st), store)
          	if _, err := coord.Write(st); err != nil {
          		t.Fatal(err)
          	}
          	fsd := &failingFSD{}
          	ctl := &Controller{Config: cfg, Policy: coord, Probe: &fakeProbe{online: map[string]bool{"nas": true}}, Shutdown: fakeShutdown{&events}, FSD: fsd}
          	_, err := ctl.Tick(context.Background(), time.Unix(2000, 0), policy.Inputs{UPS: nut.Status{Utility: nut.UtilityOnBattery}, NetworkReady: true, HealthSafe: true})
          	if err != nil {
          		t.Fatal(err)
          	}
          	if fsd.calls != 0 {
          		t.Fatalf("FSD retried after durable cap: %d calls", fsd.calls)
          	}
          	if coord.State().PowerState != state.FailedSafe || coord.State().Hosts["nas"].ShutdownState != state.ShutdownFailed {
          		t.Fatalf("expected durable failed-safe after bounded NUT retries: power=%s host=%s", coord.State().PowerState, coord.State().Hosts["nas"].ShutdownState)
          	}
          }

          var _ host.Shutdowner = nil
          EOF
          # The last declaration above intentionally should not exist; remove it if
          # the host package does not expose that interface (the interface lives in orchestrator).
          sed -i '/var _ host.Shutdowner = nil/d' agent/internal/orchestrator/nut_fsd_retry_test.go
          sed -i '/"github.com\/ami3go\/cockpit-ups-wol\/agent\/internal\/host"/d' agent/internal/orchestrator/nut_fsd_retry_test.go

          gofmt -w agent/internal/orchestrator/controller.go agent/internal/orchestrator/nut_fsd_retry_test.go
          (cd agent && go test ./internal/orchestrator/...)
          bash -n scripts/install/common.sh scripts/install/transaction.sh scripts/install/recover-interrupted-install.sh scripts/test/install-e2e.sh
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add agent/internal/orchestrator scripts/install scripts/test/install-e2e.sh
          git commit -m 'fix(armed): restore NUT FSD under hardened sandbox'
          git push origin HEAD:fix/rereview-r1-fsd-sandbox
