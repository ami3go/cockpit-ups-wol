name: fix-rereview-tail
on:
  push:
    branches: [fix/rereview-tail-quality]
    paths:
      - '.github/workflows/_fix-rereview-tail.yml'
permissions:
  contents: write
jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: fix/rereview-tail-quality
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version: '1.26.x'
          cache-dependency-path: agent/go.sum
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24.x'
      - name: Apply source changes
        run: |
          python3 .github/scripts/_apply_rereview_tail.py
          python3 .github/scripts/_fix_rereview_tail_test.py
      - name: Format and test Go
        run: |
          gofmt -w agent/internal/app/runtime.go agent/internal/app/armed.go agent/internal/app/health_supervisor_error_test.go \
            agent/internal/orchestrator/controller.go agent/internal/host/shutdown.go agent/internal/host/status_wait_test.go agent/internal/host/ssh_prerequisites_test.go
          cd agent
          go test ./...
          echo '--- safety package coverage ---'
          for pkg in policy orchestrator host state; do
            go test -cover "./internal/$pkg"
          done
      - name: Install UI test and formatting dependencies
        working-directory: cockpit
        run: npm install --save-dev --save-exact prettier@3.6.2 @testing-library/react@16.3.0 @testing-library/jest-dom@6.9.1 jsdom@27.0.0 --ignore-scripts --no-audit --no-fund
      - name: Format and test UI
        working-directory: cockpit
        run: |
          npx prettier --write 'src/**/*.{ts,tsx}'
          npm run typecheck
          npm run lint
          npm test
          npm run format:check
          npm run build
      - name: Commit generated product changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add agent cockpit
          git commit -m 'fix(review): close logging health and UI verification gaps'
          git push origin HEAD:fix/rereview-tail-quality
