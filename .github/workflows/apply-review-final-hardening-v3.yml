name: apply-review-final-hardening-v3

on:
  push:
    branches:
      - fix/review-systemd-ipc-cleanups

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: fix/review-systemd-ipc-cleanups
          fetch-depth: 3
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version: '1.23.x'
          cache-dependency-path: agent/go.sum
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24.x'
      - name: Reuse corrected patch and verify
        shell: bash
        run: |
          set -Eeuo pipefail
          git show 3b052760afae9730f5bf46ebfb1849daa46995c4^:.github/workflows/apply-review-final-hardening-v2.yml > /tmp/helper.yml
          python3 - <<'BOOT'
          from pathlib import Path
          lines=Path('/tmp/helper.yml').read_text().splitlines()
          start=next(i for i,l in enumerate(lines) if l.strip()=="python3 - <<'PY'")
          end=next(i for i in range(start+1,len(lines)) if lines[i].strip()=='PY')
          code='\n'.join((l[10:] if l.startswith('          ') else l) for l in lines[start+1:end])+'\n'
          code=code.replace("func validateUniquePriority", "func validateOptionalPercent")
          code=code.replace("\\nfunc manifestHash", "\\nfunc sleepContext")
          exec(compile(code,'review-hardening','exec'))
          BOOT
          gofmt -w agent/internal/ipc/server.go agent/internal/ipc/server_test.go agent/internal/app/runtime.go agent/internal/app/armed.go agent/internal/config/config.go agent/internal/config/revision.go agent/internal/config/review_cleanup_test.go
          bash -n scripts/install/common.sh scripts/test/installer-unit.sh scripts/test/install-e2e.sh
          (cd agent && go test ./...)
          npm --prefix cockpit ci --ignore-scripts --no-audit --no-fund
          npm --prefix cockpit run typecheck
          npm --prefix cockpit run build
          sudo apt-get update >/dev/null
          sudo apt-get install -y --no-install-recommends shellcheck >/dev/null
          find scripts -type f -name '*.sh' -print0 | xargs -0 shellcheck -x -S error
          ./scripts/test/installer-unit.sh
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add agent cockpit/build.mjs config scripts packaging/systemd docs/SECURITY.md
          git commit -m 'fix(review): finish systemd IPC and cleanup hardening'
          git push origin HEAD:fix/review-systemd-ipc-cleanups
