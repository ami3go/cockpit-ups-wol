name: Package

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'
          cache-dependency-path: agent/go.sum
      - uses: actions/setup-node@v4
        with:
          node-version: '24.x'
      - name: Build Cockpit UI
        working-directory: cockpit
        run: |
          npm install --ignore-scripts
          npm run typecheck
          npm run build
      - name: Build reproducible multi-arch appliance bundles
        env:
          VERSION: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || format('snapshot-{0}', github.sha) }}
        run: ./scripts/release/build-bundles.sh
      - name: Verify checksums and package contents
        run: |
          cd release
          sha256sum -c SHA256SUMS
          for a in *.tar.gz; do
            tar -tzf "$a" | grep -q '/install.sh$'
            tar -tzf "$a" | grep -q '/cockpit/dist/manifest.json$'
          done
      - uses: actions/upload-artifact@v4
        with:
          name: cockpit-ups-wol-packages
          path: |
            release/*.tar.gz
            release/SHA256SUMS
            release/RELEASE_NOTES.md
          if-no-files-found: error
      - name: Require project license before tagged publication
        if: startsWith(github.ref, 'refs/tags/')
        run: test -s LICENSE
      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" release/*.tar.gz release/SHA256SUMS --title "$GITHUB_REF_NAME" --notes-file release/RELEASE_NOTES.md --verify-tag
