name: Package

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: '1.23.x'
          cache-dependency-path: agent/go.sum
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '24.x'
      - name: Build Cockpit UI
        working-directory: cockpit
        run: |
          npm install --ignore-scripts
          npm run typecheck
          npm run build
      - name: Build reproducible multi-arch appliance bundles
        env:
          VERSION: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || format('snapshot-{0}', github.sha) }}
        run: ./scripts/release/build-bundles.sh
      - name: Verify checksums and package contents
        run: |
          cd release
          sha256sum -c SHA256SUMS
          for a in *.tar.gz; do
            contents="$(tar -tzf "$a")"
            grep -q '/install.sh$' <<<"$contents"
            grep -q '/cockpit/dist/manifest.json$' <<<"$contents"
            grep -q '/scripts/install/discovery.sh$' <<<"$contents"
            grep -q '/scripts/install/network.sh$' <<<"$contents"
            grep -q '/scripts/install/tui.sh$' <<<"$contents"
            grep -q '/packaging/systemd/cockpit-ups-wol-firewall.service$' <<<"$contents"
            grep -q '/packaging/systemd/cockpit-ups-wol-install-recover.service$' <<<"$contents"
            grep -q '/scripts/install/recover-interrupted-install.sh$' <<<"$contents"
            grep -q '/scripts/test/hardware-preflight.sh$' <<<"$contents"
          done
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: cockpit-ups-wol-packages
          path: |
            release/*.tar.gz
            release/SHA256SUMS
            release/RELEASE_NOTES.md
          if-no-files-found: error
      - name: Require project license before tagged publication
        if: startsWith(github.ref, 'refs/tags/')
        run: test -s LICENSE
      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" release/*.tar.gz release/SHA256SUMS --title "$GITHUB_REF_NAME" --notes-file release/RELEASE_NOTES.md --verify-tag
