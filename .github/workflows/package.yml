name: Package

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26.x'
          cache-dependency-path: agent/go.sum
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24.x'
      - name: Build Cockpit UI
        working-directory: cockpit
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npm run typecheck
          npm run build
      - name: Build reproducible multi-arch appliance bundles
        env:
          VERSION: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || format('snapshot-{0}', github.sha) }}
        run: ./scripts/release/build-bundles.sh
      - name: Build multi-arch Debian packages
        env:
          VERSION: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || format('snapshot-{0}', github.sha) }}
        run: bash ./scripts/release/build-deb.sh
      - name: Scan shipped Go binaries
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.8.0
          rm -rf /tmp/cockpit-ups-wol-release-scan
          mkdir -p /tmp/cockpit-ups-wol-release-scan
          for archive in release/*.tar.gz; do
            tar -xzf "$archive" -C /tmp/cockpit-ups-wol-release-scan
          done
          while IFS= read -r -d '' binary; do
            govulncheck -mode=binary "$binary"
          done < <(find /tmp/cockpit-ups-wol-release-scan -type f \
            \( -name cockpit-ups-wol-agent -o -name cockpit-ups-wolctl -o -name cockpit-ups-wol-health -o -name wolctl \) -print0)
      - name: Verify checksums and package contents
        run: |
          cd release
          sha256sum -c SHA256SUMS
          for a in *.tar.gz; do
            contents="$(tar -tzf "$a")"
            grep -q '/install.sh$' <<<"$contents"
            grep -q '/LICENSE$' <<<"$contents"
            grep -q '/cockpit/dist/manifest.json$' <<<"$contents"
            grep -q '/scripts/install/discovery.sh$' <<<"$contents"
            grep -q '/scripts/install/network.sh$' <<<"$contents"
            grep -q '/scripts/install/tui.sh$' <<<"$contents"
            grep -q '/packaging/systemd/cockpit-ups-wol-firewall.service$' <<<"$contents"
            grep -q '/packaging/systemd/cockpit-ups-wol-install-recover.service$' <<<"$contents"
            grep -q '/scripts/install/recover-interrupted-install.sh$' <<<"$contents"
            grep -q '/scripts/test/hardware-preflight.sh$' <<<"$contents"
          done
          for d in *.deb; do
            dpkg-deb --info "$d"
            contents="$(dpkg-deb --contents "$d")"
            grep -q 'usr/sbin/cockpit-ups-wol-setup$' <<<"$contents"
            grep -q 'usr/lib/cockpit-ups-wol/install.sh$' <<<"$contents"
            grep -q 'usr/lib/cockpit-ups-wol/cockpit/dist/manifest.json$' <<<"$contents"
            grep -q 'usr/share/doc/cockpit-ups-wol/copyright$' <<<"$contents"
          done
      - name: Smoke-test installed amd64 Debian package
        if: runner.arch == 'X64'
        run: |
          deb="$(find release -maxdepth 1 -type f -name '*_amd64.deb' -print -quit)"
          test -n "$deb"
          sudo apt-get update
          sudo apt-get install -y "$PWD/$deb"
          sudo cockpit-ups-wol-setup --check --profile local-server
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cockpit-ups-wol-packages
          path: |
            release/*.tar.gz
            release/*.deb
            release/SHA256SUMS
            release/RELEASE_NOTES.md
          if-no-files-found: error
      - name: Publish rolling testing pre-release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete testing --cleanup-tag --yes >/dev/null 2>&1 || true
          git push origin :refs/tags/testing >/dev/null 2>&1 || true
          gh release create testing \
            release/*.tar.gz release/*.deb release/SHA256SUMS \
            --target "$GITHUB_SHA" \
            --title "Testing build ${GITHUB_SHA::7}" \
            --notes-file release/RELEASE_NOTES.md \
            --prerelease
      - name: Require project license before tagged publication
        if: startsWith(github.ref, 'refs/tags/')
        run: test -s LICENSE
      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" release/*.tar.gz release/*.deb release/SHA256SUMS --title "$GITHUB_REF_NAME" --notes-file release/RELEASE_NOTES.md --verify-tag
