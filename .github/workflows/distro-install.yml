name: Distro Install Matrix

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-debian-package:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26.x'
          cache-dependency-path: agent/go.sum
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24.x'
      - name: Build Cockpit UI
        working-directory: cockpit
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npm run typecheck
          npm run build
      - name: Build amd64 Debian package input
        env:
          VERSION: matrix-${{ github.sha }}
        run: |
          ./scripts/release/build-bundles.sh
          ./scripts/release/build-deb.sh
          test "$(find release -maxdepth 1 -type f -name '*_amd64.deb' | wc -l)" -eq 1
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: distro-matrix-amd64-deb
          path: release/*_amd64.deb
          if-no-files-found: error

  systemd-install:
    needs: build-debian-package
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: debian-12
            image: debian:12-slim
          - name: debian-13
            image: debian:13-slim
          - name: ubuntu-24.04
            image: ubuntu:24.04
          - name: ubuntu-26.04
            image: ubuntu:26.04
    name: systemd-install (${{ matrix.name }})
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: distro-matrix-amd64-deb
          path: release
      - name: Verify Docker runtime
        run: |
          docker version
          docker info
      - name: Install package in systemd container
        env:
          DISTRO_IMAGE: ${{ matrix.image }}
        run: |
          deb="$(find release -maxdepth 1 -type f -name '*_amd64.deb' -print -quit)"
          test -n "$deb"
          ./scripts/test/systemd-container-install.sh "$DISTRO_IMAGE" "$deb"
